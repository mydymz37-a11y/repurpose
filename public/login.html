<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in · RepurposeKit</title><link rel="stylesheet" href="/theme.css"><style>body{min-height:100vh;display:grid;place-items:center;background:var(--surface)}main{width:min(420px,calc(100% - 32px));padding:30px}.field{margin:18px 0}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px}button{width:100%;margin-top:10px}.msg{min-height:22px;color:var(--muted);font-size:13px}</style></head><body><main class="panel"><a class="brand" href="/"><span class="brandmark">R</span>RepurposeKit</a><h1 style="font-size:27px;font-weight:850;margin:24px 0 6px" id="title">Welcome back</h1><p class="muted" id="sub">Sign in securely with a one-time email code. No password needed.</p><form id="form"><div class="field" id="emailWrap"><label>Email address</label><input id="email" type="email" autocomplete="username webauthn" required placeholder="you@example.com"></div><div class="field hidden" id="codeWrap"><label>6-digit code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"></div><button class="btn" id="submit">Send sign-in code</button><button class="btn ghost hidden" type="button" id="back">Use another email</button></form><div id="passkey" class="hidden"><p class="muted">Add a passkey to sign in next time with your fingerprint, face or device lock.</p><button class="btn" id="add">Add a passkey</button><button class="btn ghost" id="skip">Not now</button></div><p class="msg" id="msg" role="status"></p></main><script>
(()=>{const A=window.hatchable.auth,form=document.getElementById('form'),email=document.getElementById('email'),code=document.getElementById('code'),msg=document.getElementById('msg'),submit=document.getElementById('submit'),pass=document.getElementById('passkey');let step='email',hasPasskey=false;const next=()=>{let n=new URLSearchParams(location.search).get('next')||'/';return n.startsWith('/')&&!n.startsWith('//')&&!n.includes('\\')?n:'/'};const done=()=>location.replace(next());const say=s=>msg.textContent=s;const declined=()=>{try{return localStorage.getItem('rk_passkey_declined')==='1'}catch{return false}};const finish=()=>{if(hasPasskey||declined()||!A.supportsPasskeys()){done();return}form.classList.add('hidden');pass.classList.remove('hidden');document.getElementById('title').textContent='You are signed in';document.getElementById('sub').textContent='Make future sign-ins faster with a passkey.'};A.getSession().then(s=>{if(s?.user)done()}).catch(()=>{});form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{if(step==='email'){const r=await A.startLogin({email:email.value.trim()});hasPasskey=!!r.has_passkey;if(hasPasskey&&A.supportsPasskeys()){try{await A.signInWithPasskey({email:email.value.trim()});done();return}catch{}}step='code';document.getElementById('emailWrap').classList.add('hidden');document.getElementById('codeWrap').classList.remove('hidden');document.getElementById('back').classList.remove('hidden');submit.textContent='Verify code';say('A code has been sent to your email.')}else{await A.verifyCode({email:email.value.trim(),code:code.value.trim()});finish()}}catch(err){say(err.message||'Sign-in failed. Please try again.')}finally{submit.disabled=false}};document.getElementById('back').onclick=()=>{step='email';document.getElementById('emailWrap').classList.remove('hidden');document.getElementById('codeWrap').classList.add('hidden');document.getElementById('back').classList.add('hidden');submit.textContent='Send sign-in code';say('')};document.getElementById('add').onclick=async()=>{try{await A.registerPasskey({name:'RepurposeKit device'});done()}catch(e){say(e.message||'Could not add passkey. Choose Not now.')}};document.getElementById('skip').onclick=()=>{try{localStorage.setItem('rk_passkey_declined','1')}catch{}done()};email.focus()})();
</script></body></html>
